# Builds Dataphor.slnx and runs its tests in Debug and Release on every push and pull request.
# The commands are the ones in the "Build and test" section of AGENTS.md; keep the two in step.
name: Build and test

on:
  push:
    branches: [master, modernization]
    # The ticket runner commits ticket moves that change no code.
    # NOTE: if branch protection ever requires this check, a pull request that touches only these paths
    # waits for a check that never runs; add a no-op job for those paths or drop the filter then.
    # NOTE: a docs job must not be added to this workflow: this filter would skip it for exactly the
    # changes it checks. Docs checks go in .github/workflows/docs.yml, which gates the architecture
    # page size and the links under docs/.
    paths-ignore:
      - 'tickets/**'
      - 'docs/**'
  pull_request:
    branches: [master, modernization]
    paths-ignore:
      - 'tickets/**'
      - 'docs/**'
  workflow_dispatch:

# The repository is public: pull requests from forks run with this read-only token and no secrets.
# Never switch to pull_request_target.
permissions:
  contents: read

# A push to a branch never cancels the run in progress: the full suite runs only here (agents run
# targeted tests, tickets/rules/10-dataphor.md), a run takes about 18 minutes and the ticket runner
# pushes more often than that, so cancelling meant almost no run finished. GitHub keeps one run going
# and only the newest waiting one, so each finished run covers the latest commit at its start.
# A pull request still cancels its superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    # Windows only: the UI projects target net10.0-windows and NLS globalization exists only on Windows.
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Code under #if DEBUG and [Conditional("DEBUG")] differs between the two.
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: dotnet --info
        run: dotnet --info

      - name: Restore
        run: dotnet restore Dataphor.slnx

      # ContinuousIntegrationBuild is switched on by Directory.Build.props when GITHUB_ACTIONS is true.
      - name: Build
        run: dotnet build Dataphor.slnx -c ${{ matrix.configuration }} --no-restore -p:DataphorBuildNumber=${{ github.run_number }}

      # The passes that need a live SQL Server - the catalog store contract, the text parameter cases, the three
      # transaction-atomicity coverage scripts that run on a SQL Server device, the device-coverage corpus, and the
      # three sample libraries that create a SQL Server device - read DATAPHOR_TEST_MSSQL and skip themselves where it
      # is unset. SQL Server Express LocalDB is on this image as the Visual Studio component
      # Microsoft.VisualStudio.Component.SQL.LocalDB.Runtime (18.12.12405.243 on windows-2025, read 2026-11-25); the
      # image's own "Databases" section lists only PostgreSQL and MongoDB, so this step does not assume it: it prints
      # what it finds and continue-on-error keeps the job green if a later image has dropped it. The Test step below
      # then sets the variable only if this step succeeded, so the live cases go back to reporting Inconclusive rather
      # than failing - a red run because a runner image changed would be worse than a documented gap.
      - name: Start SQL Server LocalDB
        id: localdb
        continue-on-error: true
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB
          $info = sqllocaldb info MSSQLLocalDB
          $info
          if (($info -join "`n") -notmatch 'State:\s+Running') { throw 'MSSQLLocalDB is not running; the live SQL Server passes will report Inconclusive.' }

      # The PostgreSQL passes read DATAPHOR_TEST_PGSQL and skip themselves where it is unset, exactly as the SQL Server
      # ones do. This image carries PostgreSQL as a service that is installed, stopped and disabled - "postgresql-x64-14",
      # version 14.25, with the user postgres and the password root (the image's own Databases section, read 2026-11-26) -
      # so starting it is all this needs. Guarded the same way as the step above: it prints what it finds and
      # continue-on-error keeps the job green if a later image drops or renames the service, and the Test step then
      # leaves the variable empty so the live cases report Inconclusive instead of failing.
      # The password is the image's published default for a service on an ephemeral runner, not a secret, and it is the
      # only way in: PostgreSQL has no integrated-security equivalent. Nothing outside the runner can reach the server.
      # Cost: the device fixture's three cases took 13 s locally against PostgreSQL 14.25 in a container (1180 device
      # cases in about 10 s of that) and the catalog store's sixteen about 3 s; the service start is a few
      # seconds on top. The CI figure comes from the first run.
      - name: Start PostgreSQL
        id: postgres
        continue-on-error: true
        run: |
          $service = Get-Service -Name 'postgresql-x64-14' -ErrorAction Stop
          $service
          Set-Service -Name 'postgresql-x64-14' -StartupType Manual
          Start-Service -Name 'postgresql-x64-14'
          (Get-Service -Name 'postgresql-x64-14').Status
          if ((Get-Service -Name 'postgresql-x64-14').Status -ne 'Running') { throw 'postgresql-x64-14 is not running; the live PostgreSQL passes will report Inconclusive.' }

      - name: Test
        env:
          # Empty where the step above failed; TestEnvironment reads an empty value as "no server configured".
          DATAPHOR_TEST_MSSQL: ${{ steps.localdb.outcome == 'success' && 'Data Source=(localdb)\MSSQLLocalDB;Integrated Security=SSPI' || '' }}
          DATAPHOR_TEST_PGSQL: ${{ steps.postgres.outcome == 'success' && 'Host=localhost;Port=5432;Username=postgres;Password=root' || '' }}
        run: dotnet test Dataphor.slnx -c ${{ matrix.configuration }} --no-build --logger trx --results-directory artifacts/TestResults/${{ matrix.configuration }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.configuration }}
          path: artifacts/TestResults/
          if-no-files-found: ignore
          retention-days: 14
